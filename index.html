<script id="engine">
'use strict';
const SUITS=['♣','♠','♥','♦'],RANKS=['7','8','9','10','B','D','K','A'];
class Game{
 constructor(n){this.n=n;this.names=['Du','Anna','Ben','Clara','David','Eva'].slice(0,n);this.points=Array(n).fill(0);this.round=0;this.dealer=Math.floor(Math.random()*n);this.history=[];this.phase='ready';}
 deal(){if(this.round>=19)throw Error('Partie beendet');this.round++;this.size=this.round<=10?this.round:20-this.round;const deck=[];for(let copy=0;copy<2;copy++)for(let s=0;s<4;s++)for(let r=0;r<8;r++)deck.push({s,r,id:copy*32+s*8+r});for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}this.hands=Array.from({length:this.n},()=>[]);for(let c=0;c<this.size;c++)for(let k=1;k<=this.n;k++)this.hands[(this.dealer+k)%this.n].push(deck.pop());this.trumpCard=deck.pop();this.trump=this.trumpCard.s;this.rest=deck;for(const h of this.hands)h.sort((a,b)=>a.s-b.s||b.r-a.r||a.id-b.id);this.bids=Array(this.n).fill(null);this.taken=Array(this.n).fill(0);this.trick=[];this.seen=[];this.turn=(this.dealer+1)%this.n;this.first=this.turn;this.phase='bid';}
 bid(v){if(this.phase!=='bid'||!Number.isInteger(v)||v<0||v>this.size)throw Error('Ungültige Ansage');this.bids[this.turn]=v;this.turn=(this.turn+1)%this.n;if(this.bids.every(x=>x!==null)){this.phase='play';this.turn=this.first;}}
 legal(p=this.turn){const h=this.hands[p];if(!this.trick.length)return h;const follow=h.filter(c=>c.s===this.trick[0].card.s);return follow.length?follow:h;}
 beats(a,b,lead){if(a.s===b.s)return a.r>b.r;if(a.s===this.trump)return true;if(b.s===this.trump)return false;return a.s===lead&&b.s!==lead;}
 winner(trick=this.trick){let best=trick[0];for(const x of trick.slice(1))if(this.beats(x.card,best.card,trick[0].card.s))best=x;return best.p;}
 play(id){if(this.phase!=='play')throw Error('Nicht in Spielphase');const card=this.legal().find(c=>c.id===id);if(!card)throw Error('Bedienpflicht oder ungültige Karte');const p=this.turn;this.hands[p]=this.hands[p].filter(c=>c.id!==id);this.trick.push({p,card});this.seen.push(card);if(this.trick.length===this.n){this.lastWinner=this.winner();this.phase='trick';}else this.turn=(this.turn+1)%this.n;}
 collect(){if(this.phase!=='trick')throw Error('Stich unvollständig');this.taken[this.lastWinner]++;this.turn=this.lastWinner;this.trick=[];if(this.hands.every(h=>h.length===0)){const gained=this.taken.map((v,i)=>v+(v===this.bids[i]?10:0));this.points=this.points.map((p,i)=>p+gained[i]);this.history.push({round:this.round,bids:[...this.bids],taken:[...this.taken],gained});this.phase=this.round===19?'end':'round';this.dealer=(this.dealer+1)%this.n;}else this.phase='play';}
 botBid(p=this.turn){let estimate=0;for(const c of this.hands[p]){if(c.s===this.trump)estimate+=.22+.7*c.r/7;else if(c.r===7)estimate+=.55;else if(c.r===6)estimate+=.25;else if(c.r===5)estimate+=.1;}return Math.max(0,Math.min(this.size,Math.round(estimate)));}
 botCard(p=this.turn){const legal=this.legal(p),need=this.bids[p]-this.taken[p];const strength=c=>c.r+(c.s===this.trump?12:0);const sorted=[...legal].sort((a,b)=>strength(a)-strength(b));if(!this.trick.length)return need>0?sorted[sorted.length-1]:sorted[0];const winners=sorted.filter(c=>this.winner([...this.trick,{p,card:c}])===p);if(need>0)return winners[0]||sorted[0];const losers=sorted.filter(c=>!winners.includes(c));return losers.length?losers[losers.length-1]:sorted[0];}
}
</script>
<script>
const $=id=>document.getElementById(id);let game=null,timer=null,generation=0,logs=[],lang='de';
const texts={de:{title:'Stiche Raten',strap:'DEIN KARTENTISCH · TESTVERSION 2',summary:'64 Karten · 19 Runden',language:'Sprache',opponents:'Computergegner',tempo:'Spieltempo',slow:'Entspannt',normal:'Normal',fast:'Schnell',start:'Partie starten',restart:'Neu starten',settings:'Gegnerzahl gilt ab der nächsten Partie.',ready:'Bereit für die erste Runde',trump:'Trumpf',yourcards:'Deine Karten',score:'Punktestand',player:'Spieler',bid:'Ansage',tricks:'Stiche',points:'Punkte',log:'Am Tisch',help:'Helle Karten sind spielbar. Du musst die angespielte Farbe bedienen.',rules:'Eure Spielregeln',welcome:'Wähle die Anzahl der Gegner und starte deine Partie.',empty:'Wie viele Stiche holst du?',nocard:'Noch keine Karte ausgespielt',you:'Du',dealer:'Geber',first:'Erstes Aufspiel',lead:'Aufspiel',turn:'Am Zug',bidding:'sagt an …',playing:'ist am Zug …',ask:'Wie viele Stiche wirst du gewinnen?',yourturn:'Du bist am Zug · angespielt:',yourlead:'Du spielst aus. Wähle eine Karte.',collect:'Stich wird eingesammelt …',round:'Runde',cards:'Karten pro Spieler',card:'Karte pro Spieler',wins:'gewinnt den Stich.',received:'Du erhältst',hit:'Ansage getroffen!',miss:'Ansage verfehlt.',roundend:'Runde beendet. Alle Karten werden neu gemischt.',next:'Nächste Runde',new:'Neue Partie',confirm:'Die laufende Partie beenden und neu starten?',win:'gewinnt',wintie:'gewinnen gemeinsam',with:'mit',and:'und',firstline:'Erstes Aufspiel dieser Runde:',clockwise:'Im Uhrzeigersinn',said:'sagt',played:'spielt',game:'Partie mit',players:'Spielern',suits:['Kreuz','Pik','Herz','Karo'],ranks:['7','8','9','10','B','D','K','A'],rulesbody:'<p>2–6 Spieler, zwei vollständige 32er-Blätter. Rangfolge: Ass, König, Dame, Bube, 10, 9, 8, 7.</p><p>19 Runden: 1 → 10 → 1 Karten. Jede Runde werden alle 64 Karten neu gemischt. Die nächste Karte nach dem Geben bestimmt Trumpf.</p><p>Links vom Geber beginnen Ansage und erster Stich. Ansagen von 0 bis zur Handgröße sind ohne Summenbeschränkung erlaubt. Farbe bedienen ist Pflicht, sonst darfst du trumpfen oder abwerfen. Höchster Trumpf gewinnt, sonst die höchste Karte der angespielten Farbe. Bei identischen gewinnenden Karten zählt die erste.</p><p>Der Stichgewinner spielt erneut aus. Jeder Stich zählt 1 Punkt; eine exakt richtige Ansage bringt zusätzlich 10 Punkte. Der Geber wechselt im Uhrzeigersinn. Bei höchstem Punktegleichstand gewinnen mehrere Spieler.</p><p>Die Gegner verwenden nur eigene Karten, offene Ansagen und gespielte Karten. Ihre Strategie ist eine einfache Heuristik. Der erste Geber wird zufällig gewählt. Spielstände werden nicht dauerhaft gespeichert. Die Sprache lässt sich während einer Partie umschalten.</p>'},en:{title:'Up & Down',strap:'YOUR CARD TABLE · TEST VERSION 2',summary:'64 cards · 19 rounds',language:'Language',opponents:'Computer opponents',tempo:'Game speed',slow:'Relaxed',normal:'Normal',fast:'Fast',start:'Start game',restart:'Restart',settings:'Opponent count applies to the next game.',ready:'Ready for the first round',trump:'Trump',yourcards:'Your cards',score:'Scoreboard',player:'Player',bid:'Bid',tricks:'Tricks',points:'Points',log:'At the table',help:'Bright cards are playable. You must follow the suit led.',rules:'Your house rules',welcome:'Choose the number of opponents and start your game.',empty:'How many tricks will you take?',nocard:'No card played yet',you:'You',dealer:'Dealer',first:'Opening lead',lead:'Leads',turn:'To play',bidding:'is bidding …',playing:'is playing …',ask:'How many tricks will you take?',yourturn:'Your turn · suit led:',yourlead:'You lead. Choose a card.',collect:'Collecting the trick …',round:'Round',cards:'cards per player',card:'card per player',wins:'wins the trick.',received:'You receive',hit:'Bid made!',miss:'Bid missed.',roundend:'Round finished. All cards will be shuffled again.',next:'Next round',new:'New game',confirm:'End the current game and start a new one?',win:'wins',wintie:'win together',with:'with',and:'and',firstline:'Opening lead this round:',clockwise:'Clockwise',said:'bids',played:'plays',game:'Game with',players:'players',suits:['Clubs','Spades','Hearts','Diamonds'],ranks:['7','8','9','10','J','Q','K','A'],rulesbody:'<p>2–6 players, two 32-card decks. Rank: Ace, King, Queen, Jack, 10, 9, 8, 7.</p><p>19 rounds: 1 → 10 → 1 cards. All 64 cards are shuffled before each round. The next card after dealing determines trump.</p><p>The player clockwise from the dealer bids first and leads the first trick. Bids from zero to the hand size are allowed, with no restriction on the total. You must follow suit; otherwise you may trump or discard. Highest trump wins, otherwise the highest card of the suit led. If identical winning cards appear, the first one wins.</p><p>The trick winner leads next. Each trick scores 1 point; an exact bid earns 10 extra points. The dealer moves clockwise each round. Players tied for the highest score share the win.</p><p>Bots use only their own cards, public bids and played cards. Their strategy is a simple heuristic. The first dealer is chosen randomly. Game progress is not saved permanently. You can change language during a game.</p>'}};
const t=k=>texts[lang][k],name=p=>p===0?t('you'):game.names[p],rank=c=>t('ranks')[c.r],cardLabel=c=>rank(c)+SUITS[c.s];
function cardHTML(c,extra=''){return `<b>${rank(c)}</b><span>${SUITS[c.s]}</span>${extra}`;}
function setup(){const count=$('count')?.value||'3',speed=$('speed')?.value||'550';document.documentElement.lang=lang;document.title=t('title')+' · '+t('strap');$('app').innerHTML=`<header><div><small>${t('strap')}</small><h1>${t('title')}</h1></div><div class="lang"><label>${t('language')}<select id="language"><option value="de">Deutsch</option><option value="en">English</option></select></label><span class="pill">${t('summary')}</span></div></header><main><section><div class="settings panel"><label>${t('opponents')}<select id="count">${[1,2,3,4,5].map(v=>`<option>${v}</option>`).join('')}</select></label><label>${t('tempo')}<select id="speed"><option value="1000">${t('slow')}</option><option value="550">${t('normal')}</option><option value="170">${t('fast')}</option></select></label><button id="start" class="primary">${t(game?'restart':'start')}</button><small>${t('settings')}</small></div><div class="meta"><span id="round">${t('ready')}</span><span id="trump">${t('trump')} —</span></div><div class="table"><div id="seats"></div><div class="center"><div id="trumpcard" class="trump-view"></div><div class="trick" id="trick"><div class="empty">${t('empty')}</div></div><div id="result" class="result"></div></div></div><div id="leadline" class="leadline">${t('clockwise')} ↻</div><div class="yourline"><b>${t('yourcards')}</b><span id="yourstats"></span></div><div class="hand" id="hand"></div><div role="status" aria-live="polite" class="status" id="status">${t('welcome')}</div><div id="actions" class="actions"></div><p class="help">${t('help')}</p></section><aside><div class="panel"><h2>${t('score')}</h2><table class="score"><thead><tr><th>${t('player')}</th><th>${t('bid')}</th><th>${t('tricks')}</th><th>${t('points')}</th></tr></thead><tbody id="scores"></tbody></table><div id="history" class="rounds"></div></div><div class="panel" style="margin-top:18px"><h2>${t('log')}</h2><div id="log" class="log"></div></div><details class="panel"><summary>${t('rules')}</summary>${t('rulesbody')}</details></aside></main>`;$('count').value=count;$('speed').value=speed;$('language').value=lang;$('language').onchange=e=>{lang=e.target.value;setup();render();renderLog();};$('start').onclick=start;$('hand').onclick=playHuman;}
function renderLog(){$('log').innerHTML=logs.map(x=>{let str='';if(x.kind==='bid')str=`${name(x.p)} ${t('said')} ${x.v}.`;if(x.kind==='play')str=`${name(x.p)} ${t('played')} ${cardLabel(x.c)}.`;if(x.kind==='win')str=`${name(x.p)} ${t('wins')}`;if(x.kind==='round')str=`${t('round')} ${x.r}: ${x.size} · ${t('trump')} ${SUITS[x.s]}`;return `<p>${str}</p>`;}).join('');}
function log(kind,data){logs.unshift({kind,...data});logs=logs.slice(0,80);renderLog();}
function schedule(fn,mult=1){clearTimeout(timer);const token=generation;timer=setTimeout(()=>{if(token===generation)fn();},Number($('speed').value)*mult);}
function render(){const g=game;if(!g)return;const done=['round','end'].includes(g.phase),dealer=done?(g.dealer+g.n-1)%g.n:g.dealer;$('round').textContent=`${t('round')} ${g.round} / 19 · ${g.size} ${t(g.size===1?'card':'cards')}`;$('trump').textContent=`${t('trump')}: ${t('suits')[g.trump]} ${SUITS[g.trump]}`;$('trumpcard').innerHTML=`<div class="card ${g.trump>=2?'red':''}" role="img" aria-label="${t('trump')}: ${t('suits')[g.trump]} ${rank(g.trumpCard)}">${cardHTML(g.trumpCard)}</div><b>${t('trump')}<br>${t('suits')[g.trump]}</b>`;
 const leader=g.trick.length?g.trick[0].p:g.phase==='bid'?g.first:g.turn;
 $('seats').innerHTML=g.names.map((_,p)=>{const a=2*Math.PI*p/g.n,x=50-43*Math.sin(a),y=50+41*Math.cos(a);return `<div class="seat ${p===0?'human':''} ${g.turn===p&&['bid','play'].includes(g.phase)?'active':''}" style="left:${x}%;top:${y}%"><b>${name(p)}</b><small>${g.taken[p]} / ${g.bids[p]??'–'} ${t('tricks')}</small><div>${p?g.hands[p].map(()=>'<span class="back"></span>').join(''):''}</div>${p===dealer?`<span class="badge">◆ ${t('dealer')}</span>`:''}${p===g.first?`<span class="badge">↗ ${t('first')}</span>`:''}${p===leader&&!done&&g.phase!=='bid'?`<span class="badge">▶ ${t('lead')}</span>`:''}</div>`;}).join('');
 $('leadline').textContent=`${t('firstline')} ${name(g.first)} · ${t('clockwise')} ↻`;
 $('trick').innerHTML=g.trick.length?g.trick.map((x,i)=>`<div class="played"><div class="card ${x.card.s>=2?'red':''}">${cardHTML(x.card,`<i>${i+1}.</i>`)}</div><small>${name(x.p)}</small></div>`).join(''):`<small>${t('nocard')}</small>`;
 const human=g.phase==='play'&&g.turn===0,legal=human?g.legal(0).map(c=>c.id):[];$('hand').innerHTML=g.hands[0].map(c=>`<button aria-label="${t('suits')[c.s]} ${rank(c)}" class="card ${c.s>=2?'red':''} ${g.phase==='bid'?'idle':''}" data-card="${c.id}" ${!human||!legal.includes(c.id)?'disabled':''}>${cardHTML(c)}</button>`).join('');$('yourstats').textContent=`${t('bid')}: ${g.bids[0]??'–'} · ${t('tricks')}: ${g.taken[0]}`;
 $('scores').innerHTML=g.names.map((_,p)=>`<tr class="${p===0?'you':''}"><td>${name(p)}</td><td>${g.bids[p]??'–'}</td><td>${g.taken[p]}</td><td><b>${g.points[p]}</b></td></tr>`).join('');
 $('history').innerHTML=g.history.length?'<table><thead><tr><th>'+t('round')+'</th>'+g.names.map((_,p)=>`<th>${name(p)}</th>`).join('')+'</tr></thead><tbody>'+g.history.map(h=>`<tr><td>${h.round}</td>`+h.gained.map((v,p)=>`<td title="${t('bid')} ${h.bids[p]}, ${t('tricks')} ${h.taken[p]}">+${v}</td>`).join('')+'</tr>').join('')+'</tbody></table>':'';
 $('actions').innerHTML='';$('result').textContent='';if(g.phase==='bid'){$('status').textContent=g.turn===0?t('ask'):`${name(g.turn)} ${t('bidding')}`;if(g.turn===0)for(let v=0;v<=g.size;v++){const b=document.createElement('button');b.className='bid';b.textContent=v;b.onclick=()=>makeBid(v);$('actions').appendChild(b);}}
 if(g.phase==='play')$('status').textContent=human?(g.trick.length?`${t('yourturn')} ${SUITS[g.trick[0].card.s]}`:t('yourlead')):`${name(g.turn)} ${t('playing')}`;
 if(g.phase==='trick'){$('result').textContent=`${name(g.lastWinner)} ${t('wins')}`;$('status').textContent=t('collect');}
 if(done){const h=g.history[g.history.length-1];$('result').textContent=`${t('received')} ${h.gained[0]} ${t('points')} · ${t(h.bids[0]===h.taken[0]?'hit':'miss')}`;if(g.phase==='end'){const max=Math.max(...g.points),wins=g.names.map((_,p)=>p).filter(p=>g.points[p]===max);$('status').textContent=`${wins.map(name).join(' '+t('and')+' ')} ${t(wins.length>1?'wintie':'win')} ${t('with')} ${max} ${t('points')}.`;action(t('new'),start);}else{$('status').textContent=t('roundend');action(t('next'),()=>{g.deal();log('round',{r:g.round,size:g.size,s:g.trump});advance();});}}
}
function action(t,fn){const b=document.createElement('button');b.textContent=t;b.className='primary';b.onclick=fn;$('actions').appendChild(b);}
function makeBid(v){const p=game.turn;game.bid(v);log('bid',{p,v});advance();}
function advance(){render();const g=game;if(g.phase==='bid'&&g.turn!==0)schedule(()=>makeBid(g.botBid()));else if(g.phase==='play'&&g.turn!==0)schedule(()=>{const p=g.turn,c=g.botCard();g.play(c.id);log('play',{p,c});advance();});else if(g.phase==='trick')schedule(()=>{log('win',{p:g.lastWinner});g.collect();advance();},2.3);}
function start(){if(game&&!['end','ready'].includes(game.phase)&&!confirm(t('confirm')))return;generation++;clearTimeout(timer);game=new Game(Number($('count').value)+1);logs=[];game.deal();$('start').textContent=t('restart');log('round',{r:1,size:1,s:game.trump});advance();}
function playHuman(e){const b=e.target.closest('[data-card]');if(!b||b.disabled||!game||game.turn!==0||game.phase!=='play')return;const c=game.hands[0].find(c=>c.id===Number(b.dataset.card));game.play(c.id);log('play',{p:0,c});advance();}
setup();

</script></html>
